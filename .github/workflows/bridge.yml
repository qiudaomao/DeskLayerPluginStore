name: Community catalog bridge

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch verified plugins from forum
        env:
          DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
          DISCOURSE_URL: https://bbs.byteplayer.app
        run: node scripts/bridge/fetch.mjs

      - name: Commit catalog updates
        run: |
          git add community/
          if git diff --cached --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "community-bridge[bot]"
          git config user.email "noreply@byteplayer.app"
          git commit -m "community: sync catalog from forum"
          git push
